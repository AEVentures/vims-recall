<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { width: 1200px; height: 630px; background: #0b0c10; font-family: Inter, system-ui, sans-serif; color: #f2f3f7; overflow: hidden; position: relative; }
      .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(140px); opacity: 0.35; }
      .g1 { background: #8b5cf6; left: -300px; top: -400px; }
      .g2 { background: #38bdf8; right: -350px; bottom: -450px; }
      .wrap { position: relative; display: flex; height: 100%; padding: 72px 80px; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 16px; font-weight: 600; font-size: 28px; letter-spacing: -0.01em; color: #c9ccd6; }
      .brand span { color: #a78bfa; }
      h1 { font-size: 72px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 700; margin-top: 28px; max-width: 640px; }
      p { font-size: 26px; color: #9aa0ad; margin-top: 24px; max-width: 600px; line-height: 1.35; }
      .pills { display: flex; gap: 10px; margin-top: 36px; }
      .pill { font-size: 18px; font-weight: 600; padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); }
      .cards { position: relative; width: 420px; height: 420px; }
      .card { position: absolute; width: 360px; height: 220px; border-radius: 22px; background: linear-gradient(160deg, #15161e, #0f1016); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 30px 80px -30px rgba(0,0,0,0.9); padding: 28px; display: flex; flex-direction: column; justify-content: space-between; }
      .c1 { left: 60px; top: 160px; transform: rotate(-7deg); }
      .c2 { left: 30px; top: 110px; transform: rotate(4deg); opacity: 0.9; }
      .c3 { left: 0px; top: 60px; transform: rotate(-2deg); }
      .q { font-size: 24px; font-weight: 600; line-height: 1.3; }
      .cloze { color: #a78bfa; }
      .btns { display: flex; gap: 8px; }
      .b { flex: 1; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
      .again { background: rgba(236,72,72,0.15); color: #f87171; } .hard { background: rgba(245,158,11,0.15); color: #fbbf24; } .good { background: rgba(16,185,129,0.15); color: #34d399; } .easy { background: rgba(56,189,248,0.15); color: #38bdf8; }
    </style>
  </head>
  <body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="wrap">
      <div>
        <div class="brand">
          <svg width="44" height="44" viewBox="0 0 128 128"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect width="128" height="128" rx="28" fill="#0b0c10"/><rect x="22" y="34" width="72" height="52" rx="10" fill="none" stroke="url(#g)" stroke-width="6" transform="rotate(-8 58 60)"/><rect x="36" y="44" width="72" height="52" rx="10" fill="url(#g)"/><path d="M54 70l10 10 18-22" fill="none" stroke="#0b0c10" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          VIMS <span>Recall</span>
        </div>
        <h1>Remember anything.<br/>Forget nothing.</h1>
        <p>Spaced-repetition flashcards that live on your device. Decks, cloze, custom note types, Anki-style scheduling.</p>
        <div class="pills"><div class="pill">Local-first</div><div class="pill">Private</div><div class="pill">Free</div></div>
      </div>
      <div class="cards">
        <div class="card c1"></div>
        <div class="card c2"></div>
        <div class="card c3">
          <div class="q">The capital of France is <span class="cloze">[...]</span></div>
          <div class="btns"><div class="b again">Again</div><div class="b hard">Hard</div><div class="b good">Good</div><div class="b easy">Easy</div></div>
        </div>
      </div>
    </div>
  </body>
</html>
